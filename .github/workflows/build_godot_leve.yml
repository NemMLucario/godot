name: Build Godot 4.x Ultra Seco

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Pegando o codigo
        uses: actions/checkout@v4

      - name: Setup Java (Obrigatorio pro APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Instalando as ferramentas
        run: |
          python -m pip install scons
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libasound2-dev libpulse-dev libudev-dev libfreetype6-dev
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Derretendo o motor no SCons
        run: |
          scons platform=android target=template_release arch=arm64 optimize=size use_lto=yes production=yes swappy=no disable_3d=yes module_glslang_enabled=yes module_text_server_adv_enabled=no module_text_server_fb_enabled=yes module_navigation_enabled=no module_mobile_vr_enabled=no module_openxr_enabled=no module_raycast_enabled=no module_upnp_enabled=no module_enet_enabled=no module_webrtc_enabled=no module_websocket_enabled=no module_noise_enabled=no module_camera_enabled=no module_bmp_enabled=no module_tga_enabled=no -j$(nproc)
      - name: Fechando o pacote no Gradle
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
      - name: Radar pra achar o bicho
        run: find . -name "*.apk"

      - name: Subindo o Loot pro seu bolso
        uses: actions/upload-artifact@v4
        with:
          name: godot4-template-leve
          path: "**/*.apk"
